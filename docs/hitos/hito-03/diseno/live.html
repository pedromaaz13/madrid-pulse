@media(max-width:740px){header{height:54px;padding:0 12px;gap:12px}.brand{font-size:20px;gap:5px}.logo{height:24px;width:24px;font-size:17px}nav{gap:6px}nav button{font-size:12px;padding-left:2px;padding-right:2px}.demo{font-size:9px;letter-spacing:.01em}.demo:before{display:none}main{display:flex;flex-direction:column-reverse;height:calc(100dvh - 102px);min-height:510px}.map{flex:1;min-height:175px}aside{height:43%;border:0;padding:6px 16px 13px;position:relative}.expanded aside{height:63%}.sheet{display:block;float:right;font-size:11px;color:var(--blue);margin-top:3px}.searchbox{width:72%;margin:4px 0}.searchbox input{padding-top:6px;padding-bottom:6px}.label{margin-top:12px}.pills{margin:5px 0 12px}h1{font-size:33px}.row{padding:8px 0}.maptop{top:8px;left:8px}.controls{top:8px;right:8px}.legend{left:5px;bottom:4px;font-size:9px}.mapcap{display:none}.alertbar{height:48px;gap:6px;padding:0 8px}.alertbar .mono{font-size:9px}.alertbar .event{font-size:12px}.analytics{overflow-x:auto}.analytics th,.analytics td{padding:9px 3px;font-size:13px}}

<script>
'use strict';
const $=x=>document.getElementById(x), ns='http://www.w3.org/2000/svg';
function svg(tag,attrs,root){const el=document.createElementNS(ns,tag);Object.entries(attrs).forEach(([k,v])=>el.setAttribute(k,v));root.append(el);return el}
const stations={'Móstoles':[36,444],'Alcorcón':[95,391],'Aluche':[267,311],'Laguna':[358,300],'Embajadores':[468,290],'Atocha':[575,278],'Méndez Álvaro':[654,332],'Humanes':[505,492],'Sol':[543,214],'Nuevos Ministerios':[555,119],'Chamartín':[613,58],'Villaverde Alto':[568,420]};
const lines={C5:{color:'#ffc95b',names:['Móstoles','Alcorcón','Aluche','Laguna','Embajadores','Atocha','Méndez Álvaro','Villaverde Alto','Humanes'],d:'M36 444 L78 406 Q88 395 95 391 L142 391 Q157 391 169 378 L217 326 Q228 311 245 311 L267 311 L318 311 Q330 311 340 300 L358 300 L418 300 Q430 300 441 290 L468 290 L512 290 Q523 290 533 278 L575 278 L602 278 Q613 278 623 290 L654 332 L672 355 Q678 365 665 372 L581 411 L568 420 L505 492'},C4:{color:'#6de3d0',names:['Chamartín','Nuevos Ministerios','Sol','Atocha','Villaverde Alto'],d:'M613 58 L579 89 Q572 96 570 106 L555 119 L544 141 Q538 151 541 167 L543 214 L543 236 Q543 245 554 255 L575 278 L582 306 Q583 321 579 341 L568 420'}};
const trains=[{id:'20842',line:'C5',dest:'Humanes',minute:34,delay:120,p:.55},{id:'17032',line:'C4',dest:'Villaverde Alto',minute:36,delay:0,p:.5},{id:'20849',line:'C5',dest:'Humanes',minute:67,delay:null,p:.02}];
let station='Atocha',train=null,tab='Live',mode='gps',filter='all',follow=false,zoom=1,pan=[0,0],paths={},marks={},pts={},elapsed=0,last=performance.now(),paused=matchMedia('(prefers-reduced-motion: reduce)').matches,eventIdx=0;
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
const mobile=matchMedia('(max-width:740px)');
function mapViewport(){return mobile.matches?{box:'250 90 420 365',x:460,y:272.5}:{box:'0 0 850 540',x:425,y:270}}
function updateViewport(){$('mapSvg').setAttribute('viewBox',mapViewport().box)}
updateViewport();mobile.addEventListener('change',updateViewport);
function action(el,fn){el.setAttribute('tabindex','0');el.setAttribute('role','button');el.addEventListener('click',fn);el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fn()}})}
Object.entries({'CASA DE CAMPO':[99,108],'CHAMBERÍ':[386,118],'RETIRO':[663,255],'CARABANCHEL':[235,402],'LATINA':[164,252],'CENTRO':[424,200]}).forEach(([name,[x,y]])=>svg('text',{x,y,class:'district'},$('districts')).textContent=name);
for(const [k,l] of Object.entries(lines)){const g=svg('g',{'data-route':k},$('tracks'));svg('path',{d:l.d,stroke:'#10252c','stroke-width':10,fill:'none'},g);paths[k]=svg('path',{d:l.d,stroke:l.color,'stroke-width':4,fill:'none','stroke-linecap':'round'},g)}
for(const [name,[x,y]] of Object.entries(stations)){const g=svg('g',{class:'station',transform:'translate('+x+' '+y+')','aria-label':'Abrir estación '+name,'data-stop':name},$('stops'));svg('circle',{r:16,fill:'transparent'},g);svg('circle',{r:name==='Atocha'?8:5,stroke:'#f0f6ed','stroke-width':2.5,fill:'#203540'},g);svg('text',{x:name==='Alcorcón'?-18:10,y:name==='Atocha'?-13:name==='Villaverde Alto'?19:-10},g).textContent=name;action(g,()=>selectStation(name))}
for(const t of trains){const g=svg('g',{class:'vehicle','aria-label':'Abrir tren '+t.id},$('vehicles'));svg('rect',{x:-19,y:-10,width:38,height:20,rx:8,stroke:'#152c35','stroke-width':2,fill:lines[t.line].color},g);svg('text',{'text-anchor':'middle',y:3},g).textContent=t.line+' ›';action(g,()=>selectTrain(t.id));marks[t.id]=g}
const offsets={C5:[-38,-31,-16,-12,-5,0,4,15,32],C4:[-15,-10,-4,0,13]};
function departure(t,n){return t.minute+offsets[t.line][lines[t.line].names.indexOf(n)]}
function time(m){return String(15+Math.floor(m/60))+':'+String(m%60).padStart(2,'0')}
function clearSearch(){$('search').value='';$('results').replaceChildren()}
function selectStation(n){station=n;train=null;follow=false;if(mobile.matches){const [x,y]=stations[n];centerOn({x,y})}clearSearch();setTab('Live')}
function selectTrain(id){train=trains.find(t=>t.id===id);follow=false;clearSearch();setTab('Live')}
function relevant(t){return filter==='all'||filter===t.line}
function serviceAt(t,n){return relevant(t)&&lines[t.line].names.includes(n)}
function source(){return {gps:'GPS observado',inter:'Interpolado entre dos lecturas',estimate:'Estimado por horario',stale:'Última posición · hace 4 min',offline:'Sin conexión · último dato disponible'}[mode]}
function renderPanel(){const serving=Object.keys(lines).filter(k=>lines[k].names.includes(station)&&(filter==='all'||k===filter));let h='';
if(!train){h='<div class="label">Estación · Cercanías Madrid</div><h1>'+station+'</h1><div class="pills">'+serving.map(k=>'<b class="pill '+k+'">'+k+'</b>').join('')+'</div><h2>Próximas salidas</h2><p class="mute">Hora prevista · escenario de muestra</p>';
 const list=trains.filter(t=>serviceAt(t,station)&&t.dest!==station&&departure(t,station)>=32);h+=list.map(t=>{const m=departure(t,station);return '<button class="row" data-train="'+t.id+'"><span><b class="pill '+t.line+'">'+t.line+'</b> <b>'+t.dest+'</b><small>'+((mode==='stale'||mode==='offline')?'Previsión sin actualizar':t.delay===null?'Solo horario':t.delay?'Retraso +2 min':'En hora')+'</small></span><em>'+time(m)+'</em></button>'}).join('')||'<p class="mute">Sin salidas de muestra para esta estación y filtro.</p>';
}else{const t=train;h='<button class="back" data-back>← Tablero de '+station+'</button><div class="label">Circulación '+t.id+'</div><h1>'+t.dest+'</h1><div class="pills"><b class="pill '+t.line+'">'+t.line+'</b><span class="meta">'+source()+'</span></div><button class="primary" data-follow>'+ (follow?'Dejar de seguir':'Seguir tren')+'</button><div class="rule"></div><h2>Itinerario de muestra</h2><div class="route">'+lines[t.line].names.map(n=>'<p>'+n+'</p>').join('')+'</div><button class="back" data-history>Ver historial de este tren →</button>'}
$('panel').innerHTML=h;$('state').textContent=source();$('panel').querySelectorAll('[data-train]').forEach(b=>b.onclick=()=>selectTrain(b.dataset.train));const e=s=>$('panel').querySelector(s);if(e('[data-back]'))e('[data-back]').onclick=()=>selectStation(station);if(e('[data-follow]'))e('[data-follow]').onclick=()=>{follow=!follow;if(follow){zoom=1.65;centerOn(pts[tKey()])}renderPanel()};if(e('[data-history]'))e('[data-history]').onclick=()=>setTab('History');
for(const [k,p] of Object.entries(paths))p.parentNode.style.opacity=(filter==='all'||filter===k)?1:.13;for(const t of trains){marks[t.id].style.display=relevant(t)?'':'none';marks[t.id].style.opacity=['stale','offline'].includes(mode)?.48:1;const r=marks[t.id].querySelector('rect');r.setAttribute('stroke-dasharray',mode==='estimate'?'3 2':'none');r.setAttribute('stroke',mode==='inter'?'#fff':'#152c35')}
for(const g of $('stops').children){const n=g.dataset.stop;g.style.opacity=(filter==='all'||lines[filter].names.includes(n))?1:.2;g.querySelectorAll('circle')[1].setAttribute('fill',n===station?'#2c58ca':'#203540')}}
function tKey(){return train?.id}
function draw(){ $('world').setAttribute('transform','translate('+pan[0]+' '+pan[1]+') scale('+zoom+')')}
function centerOn(pt){if(!pt)return;const v=mapViewport();pan=[v.x-pt.x*zoom,v.y-pt.y*zoom];draw()}
function frame(now){let dt=Math.min(now-last,100);last=now;if(tab==='Live'&&!['offline','stale'].includes(mode)&&!reduced.matches)elapsed+=dt;for(const t of trains){const path=paths[t.line],ms=mode==='gps'?Math.floor(elapsed/8000)*8000:elapsed;const p=Math.min(.96,t.p+ms/1000000);const pt=path.getPointAtLength(path.getTotalLength()*p);pts[t.id]=pt;marks[t.id].setAttribute('transform','translate('+pt.x+' '+pt.y+')')}if(follow&&train)centerOn(pts[tKey()]);requestAnimationFrame(frame)}
function changeZoom(by){const target=Math.max(.7,Math.min(3,zoom+by));const v=mapViewport(),c=[(v.x-pan[0])/zoom,(v.y-pan[1])/zoom];zoom=target;pan=[v.x-c[0]*zoom,v.y-c[1]*zoom];draw()}
$('plus').onclick=()=>changeZoom(.25);$('minus').onclick=()=>changeZoom(-.25);$('reset').onclick=()=>{zoom=1;pan=[0,0];follow=false;draw();renderPanel()};
let start;function point(e){const p=$('mapSvg').createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform($('mapSvg').getScreenCTM().inverse())}
$('mapSvg').onpointerdown=e=>{if(e.target.closest('[role=button]'))return;const p=point(e);start=[p.x,p.y,...pan];$('mapSvg').setPointerCapture(e.pointerId)};
$('mapSvg').onpointermove=e=>{if(!start)return;const p=point(e);if(Math.abs(p.x-start[0])+Math.abs(p.y-start[1])<3)return;if(follow){follow=false;renderPanel()}pan=[start[2]+p.x-start[0],start[3]+p.y-start[1]];draw()};$('mapSvg').onpointerup=$('mapSvg').onpointercancel=()=>{start=null};
$('line').onchange=e=>{filter=e.target.value;if(train&&!relevant(train)){train=null;follow=false}renderPanel()};$('signal').onchange=e=>{mode=e.target.value;renderPanel()};$('sheet').onclick=()=>{$('live').classList.toggle('expanded');$('sheet').textContent=$('live').classList.contains('expanded')?'Recoger panel':'Ampliar panel'};
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();$('search').oninput=e=>{const q=norm(e.target.value.trim()),res=$('results');res.replaceChildren();if(!q)return;for(const n of Object.keys(stations).filter(n=>norm(n).includes(q))){const b=document.createElement('button');b.textContent=n;b.onclick=()=>{if(filter!=='all'&&!lines[filter].names.includes(n)){filter='all';$('line').value='all'}selectStation(n)};res.append(b)}if(!res.children.length)res.textContent='Sin coincidencias'};$('search').onkeydown=e=>{if(e.key==='Escape')clearSearch();if(e.key==='Enter')$('results').querySelector('button')?.click()};
let exploreLine='Todas';function analytics(){const a=$('analytics');if(tab==='History'){const t=train||trains[0];a.innerHTML='<p class="label">Histórico · Replay de muestra</p><h1>Tren '+t.id+'</h1><p class="mute">'+t.line+' · Dirección '+t.dest+' · 20 noviembre</p><table><thead><tr><th>Hora</th><th>Dato conocido</th><th>Procedencia</th></tr></thead><tbody><tr><td>15:30</td><td>Salida programada</td><td>Horario</td></tr><tr><td>15:31</td><td>Primera posición</td><td>GPS</td></tr><tr><td>15:32</td><td>'+(t.delay===null?'Retraso desconocido':t.delay===0?'En hora':'Retraso +2 min')+'</td><td>'+(t.delay===null?'Sin actualización':'Actualización de viaje')+'</td></tr></tbody></table><button class="primary" id="returnTrain">Volver al tren</button>';$('returnTrain').onclick=()=>selectTrain(t.id)}else{const values=exploreLine==='C5'?[16,20,24]:exploreLine==='C4'?[9,12,15]:[25,32,39];a.innerHTML='<p class="label">Explore · Datos de muestra</p><h1>Puntualidad por línea</h1><p class="mute">Último retraso reportado dentro de ±5 min · día de ejemplo</p><label>Línea <select id="eline">'+['Todas','C5','C4'].map(k=>'<option '+(k===exploreLine?'selected':'')+'>'+k+'</option>').join('')+'</select></label><div class="rule"></div><span class="big">'+Math.round(values[0]*100/values[1])+' %</span><p>'+values[0]+' de '+values[1]+' viajes con retraso conocido dentro del umbral.</p><div class="rule"></div><h2>Cobertura del retraso</h2><p>'+values[1]+' de '+values[2]+' viajes programados con dato ('+Math.round(values[1]*100/values[2])+' %).</p><p class="mute">Los viajes sin dato quedan fuera del cálculo de puntualidad.</p>';$('eline').onchange=e=>{exploreLine=e.target.value;analytics()}}}
function setTab(next){tab=next;$('live').hidden=tab!=='Live';$('analytics').hidden=tab==='Live';document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===tab?'page':'false'));if(tab==='Live')renderPanel();else analytics()}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
const events=[['C5 · Atocha · El tren 20842 acumula 2 min de retraso.',()=>selectTrain('20842')],['C4 · Nuevos Ministerios · Consulta las próximas salidas.',()=>selectStation('Nuevos Ministerios')]];function news(){const b=$('event');b.textContent=events[eventIdx][0];b.onclick=()=>{filter='all';$('line').value='all';events[eventIdx][1]()};b.classList.remove('enter');void b.offsetWidth;b.classList.add('enter');$('pause').textContent=paused?'Reanudar':'Pausar';$('pause').setAttribute('aria-label',(paused?'Reanudar':'Pausar')+' informador')}
$('pause').onclick=()=>{paused=!paused;news()};setInterval(()=>{if(!paused&&!document.hidden){eventIdx=(eventIdx+1)%events.length;news()}},11000);news();renderPanel();requestAnimationFrame(frame);
</script></html>
